<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>機甲反應爐 - 乘法速算特訓 ⚡</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.9);
            --accent-cyan: #38bdf8;
            --accent-green: #4ade80;
            --accent-yellow: #facc15;
            --accent-red: #ff7675;
            --text-color: #f8fafc;
            --btn-bg: #334155;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

        body {
            font-family: "Chalkboard SE", "Comic Sans MS", "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh; overflow: hidden;
        }

        /* 雙層背景防呆 */
        .battle-bg-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            overflow: hidden; pointer-events: none;
        }
        .battle-bg-img {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.65;
        }

        .app-container {
            width: 100%; max-width: 420px; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px 15px; padding-bottom: max(12px, env(safe-area-inset-bottom)); position: relative;
        }

        .hud {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(30, 41, 59, 0.85); padding: 6px 12px; border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3); backdrop-filter: blur(5px);
        }
        .hud-btn-group { display: flex; gap: 6px; }
        .hud-icon-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 0.95rem;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
        }

        /* 心心血量 UI */
        .hp-box {
            font-size: 1.2rem; letter-spacing: 2px;
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 0 8px rgba(255, 118, 117, 0.8);
        }
        .hp-box.shake { animation: hpShake 0.3s ease; }
        @keyframes hpShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .score-box { text-align: right; }
        .score-box div { font-size: 0.65rem; color: #94a3b8; }
        .score-box span { font-size: 0.95rem; font-weight: bold; color: var(--accent-cyan); }

        /* 時間倒數能量條 */
        .timer-bar-container {
            width: 100%; height: 10px; background: rgba(255,255,255,0.1);
            border-radius: 10px; margin: 6px 0; overflow: hidden; border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .timer-bar-fill {
            height: 100%; width: 100%; background: linear-gradient(90deg, #4ade80, #facc15, #ff7675);
            transition: width 0.1s linear; border-radius: 10px;
        }

        .progress-text { text-align: center; font-size: 0.85rem; color: var(--accent-yellow); font-weight: bold; }

        .main-game-area {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; width: 100%; min-height: 0; position: relative;
        }

        .battle-stage {
            display: flex; justify-content: space-around; align-items: center;
            width: 100%; max-width: 320px; height: 110px; position: relative; margin-bottom: 5px;
        }
        .hero-box, .monster-box {
            position: relative; width: 95px; height: 95px;
            display: flex; justify-content: center; align-items: center;
        }
        .hero-img, .monster-img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(56, 189, 248, 0.4));
        }
        .hero-img { animation: floatHero 2.5s ease-in-out infinite; }
        @keyframes floatHero { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .monster-img { animation: pulseMonster 1.8s ease-in-out infinite; }
        @keyframes pulseMonster { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .boom-effect {
            position: absolute; top: 50%; right: 10px; transform: translate(0, -50%) scale(0);
            width: 140px; height: 140px; pointer-events: none; opacity: 0; z-index: 10;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center;
        }
        .boom-effect.active { transform: translate(0, -50%) scale(1.2); opacity: 1; }

        .math-card {
            background: rgba(15, 23, 42, 0.9); border: 3px solid var(--accent-cyan);
            border-radius: 20px; padding: 16px 40px; text-align: center;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.25); margin-bottom: 8px; min-width: 220px;
        }
        .math-formula { font-size: 2.6rem; font-weight: bold; letter-spacing: 2px; color: #fff; line-height: 1.2; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: auto; }
        .opt-btn {
            background: var(--btn-bg); border: none; border-bottom: 5px solid #1e293b;
            border-radius: 16px; padding: 14px 0; font-size: 1.6rem; font-weight: bold;
            color: #fff; cursor: pointer; transition: all 0.08s ease;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .opt-btn:active { transform: translateY(3px); border-bottom-width: 2px; background: #475569; }
        .opt-btn.correct { background: var(--accent-green) !important; color: #0f172a !important; }
        .opt-btn.wrong { background: #ef4444 !important; color: #fff !important; }

        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(5px);
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        .modal-card {
            background: var(--card-bg); border: 3px solid var(--accent-cyan);
            border-radius: 20px; padding: 20px; width: 85%; max-width: 320px; text-align: center;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3); transition: border-color 0.3s;
        }

        .modal-card.lose-theme {
            border-color: var(--accent-red);
            box-shadow: 0 10px 30px rgba(255, 118, 117, 0.4);
            animation: pulseRed 1.5s infinite;
        }
        @keyframes pulseRed { 0%, 100% { border-color: var(--accent-red); } 50% { border-color: #d63031; } }

        .menu-btn {
            background: transparent; border: 2px solid var(--accent-cyan);
            color: white; padding: 12px 20px; margin: 8px 0; font-size: 1.1rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; width: 100%; transition: all 0.2s;
        }
        .menu-btn:active { transform: scale(0.95); background: var(--accent-cyan); color: #000; }
        .level-tag { font-size: 0.8rem; opacity: 0.8; display: block; margin-top: 2px; color: var(--accent-yellow); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="battle-bg-container">
        <img src="bg_reactor.png" class="battle-bg-img" onerror="this.style.display='none';">
    </div>

    <div class="app-container">
        <div class="hud">
            <div class="hud-btn-group">
                <button class="hud-icon-btn" id="sound-btn" onclick="toggleSound()">🔊</button>
                <button class="hud-icon-btn" id="vibrate-btn" onclick="toggleVibrate()">📳</button>
                <button class="hud-icon-btn" onclick="openLevelSelect()" title="返回選單">🏠</button>
                <button class="hud-icon-btn" onclick="togglePause()">⏸️</button>
            </div>
            <div class="hp-box" id="hp-display">❤️❤️❤️</div>
            <div class="score-box">
                <div>BEST: <span id="high-score">0</span></div>
                <div>SCORE: <span id="score">0</span></div>
            </div>
        </div>

        <div>
            <div class="progress-text">反應爐進度：<span id="current-q-num">1</span> / 25</div>
            <!-- 時間倒數血條 -->
            <div class="timer-bar-container">
                <div class="timer-bar-fill" id="timer-bar"></div>
            </div>
        </div>

        <div class="main-game-area">
            <div class="battle-stage">
                <div class="hero-box">
                    <img src="hero.png" class="hero-img" id="hero-img" onerror="this.style.display='none'; document.getElementById('emoji-hero').style.display='block';">
                    <span id="emoji-hero" style="font-size:3.5rem; display:none;">🤖</span>
                </div>
                <div style="font-size:1.5rem; font-weight:bold; color:var(--accent-yellow);">VS</div>
                <div class="monster-box">
                    <img src="m1.png" class="monster-img" id="monster-img" onerror="this.style.display='none'; document.getElementById('emoji-monster').style.display='block';">
                    <span id="emoji-monster" style="font-size:3.5rem; display:none;">👾</span>
                </div>

                <div id="boom-box" class="boom-effect">
                    <img src="boom.png" style="width:100%; height:100%; object-fit:contain;" onerror="this.style.display='none'; document.getElementById('emoji-boom').style.display='block';">
                    <span id="emoji-boom" style="font-size:4rem; display:none;">💥</span>
                </div>
            </div>

            <div class="math-card">
                <div class="math-formula"><span id="num-a">7</span> × <span id="num-b">8</span></div>
            </div>
        </div>

        <div class="options-grid" id="options-grid"></div>

        <div id="level-modal" class="modal">
            <div class="modal-card">
                <div style="height: 80px; display:flex; justify-content:center; align-items:center; margin-bottom:10px;">
                    <img src="hero.png" style="max-height:100%; object-fit:contain;" onerror="this.style.display='none'; document.getElementById('modal-emoji').style.display='block';">
                    <span id="modal-emoji" style="font-size:3.5rem; display:none;">⚡</span>
                </div>
                <h2 style="color:var(--accent-cyan); margin: 5px 0;">乘法反應爐特訓</h2>
                <p style="color:#94a3b8; font-size:0.85rem; margin-bottom:15px;">訓練瞬間對照反應速算（超時扣血）</p>
                <button class="menu-btn" onclick="selectLevel(1)">1️⃣ 基礎速算 (2, 3, 4, 5 段)<span class="level-tag">每題 6 秒速算限時</span></button>
                <button class="menu-btn" onclick="selectLevel(2)">2️⃣ 高階速算 (6, 7, 8, 9 段)<span class="level-tag">每題 5 秒極速反應</span></button>
                <button class="menu-btn" onclick="selectLevel(3)">3️⃣ 極速反應爐大亂鬥<span class="level-tag">每題 4 秒狂暴極限倒數</span></button>
            </div>
        </div>

        <div id="msg-modal" class="modal hidden">
            <div class="modal-card" id="msg-card">
                <h2 id="msg-title" style="margin-top:0;">標題</h2>
                <p id="msg-body">內容說明</p>
                <button class="menu-btn" onclick="restartGame()">↺ 重新挑戰</button>
                <button class="menu-btn" onclick="openLevelSelect()">🏠 選擇關卡</button>
            </div>
        </div>
    </div>

    <script>
        let currentLevel = 1;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('reactor_high_score')) || 0;
        let hp = 3;
        let maxHp = 3;
        let questionCount = 0;
        let maxQuestions = 25;
        let currentQuestion = null;
        let isAnsweringLocked = false;
        let soundEnabled = true;
        let vibrateEnabled = true;

        // 倒數計時器變數
        let timerInterval = null;
        let timeLeft = 0;
        let timePerQuestion = 6; // 預設 6 秒倒數

        document.getElementById('high-score').innerText = highScore;

        function updateHpUI() {
            let hpStr = "";
            for (let i = 0; i < maxHp; i++) {
                hpStr += (i < hp) ? "❤️" : "🖤";
            }
            document.getElementById('hp-display').innerText = hpStr;
        }

        function selectLevel(lvl) {
            currentLevel = lvl;
            timePerQuestion = (lvl === 1) ? 6 : (lvl === 2) ? 5 : 4;
            document.getElementById('level-modal').classList.add('hidden');
            restartGame();
        }

        function openLevelSelect() {
            clearInterval(timerInterval);
            document.getElementById('msg-modal').classList.add('hidden');
            document.getElementById('level-modal').classList.remove('hidden');
        }

        function restartGame() {
            clearInterval(timerInterval);
            score = 0;
            hp = maxHp;
            questionCount = 0;
            isAnsweringLocked = false;
            document.getElementById('score').innerText = score;
            document.getElementById('msg-modal').classList.add('hidden');
            updateHpUI();
            nextQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = timePerQuestion;
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.width = '100%';

            const totalSteps = timePerQuestion * 10;
            let currentStep = totalSteps;

            timerInterval = setInterval(() => {
                if (isAnsweringLocked) return;

                currentStep--;
                let percentage = (currentStep / totalSteps) * 100;
                timerBar.style.width = percentage + '%';

                if (currentStep <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 100);
        }

        function handleTimeOut() {
            if (isAnsweringLocked) return;
            isAnsweringLocked = true;

            hp--;
            updateHpUI();

            const hpBox = document.getElementById('hp-display');
            hpBox.classList.add('shake');
            setTimeout(() => hpBox.classList.remove('shake'), 300);

            if (vibrateEnabled && navigator.vibrate) navigator.vibrate(300);

            if (hp <= 0) {
                setTimeout(() => showLoseModal("⌛ 時間到！反應爐過載！"), 400);
            } else {
                setTimeout(() => nextQuestion(), 800);
            }
        }

        function generateQuestion() {
            let numA, numB;
            if (currentLevel === 1) {
                numA = [2, 3, 4, 5][Math.floor(Math.random() * 4)];
                numB = Math.floor(Math.random() * 9) + 1;
            } else if (currentLevel === 2) {
                numA = [6, 7, 8, 9][Math.floor(Math.random() * 4)];
                numB = Math.floor(Math.random() * 9) + 1;
            } else {
                numA = Math.floor(Math.random() * 9) + 1;
                numB = Math.floor(Math.random() * 9) + 1;
            }

            let ans = numA * numB;
            let options = [ans];

            while (options.length < 4) {
                let offset = (Math.floor(Math.random() * 4) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let wrongAns = ans + offset;
                if (wrongAns > 0 && !options.includes(wrongAns)) {
                    options.push(wrongAns);
                }
            }
            options.sort(() => Math.random() - 0.5);

            return { numA, numB, ans, options };
        }

        function nextQuestion() {
            if (questionCount >= maxQuestions) {
                clearInterval(timerInterval);
                showWinModal();
                return;
            }

            questionCount++;
            document.getElementById('current-q-num').innerText = questionCount;
            currentQuestion = generateQuestion();
            isAnsweringLocked = false;

            document.getElementById('num-a').innerText = currentQuestion.numA;
            document.getElementById('num-b').innerText = currentQuestion.numB;

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            currentQuestion.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });

            speakCurrentQuestion();
            startTimer();
        }

        function checkAnswer(selectedOpt, btn) {
            if (isAnsweringLocked) return;

            clearInterval(timerInterval);

            if (selectedOpt === currentQuestion.ans) {
                isAnsweringLocked = true;
                btn.classList.add('correct');
                score += 10;
                document.getElementById('score').innerText = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('reactor_high_score', highScore);
                    document.getElementById('high-score').innerText = highScore;
                }

                const boom = document.getElementById('boom-box');
                boom.classList.add('active');
                setTimeout(() => boom.classList.remove('active'), 500);

                setTimeout(() => nextQuestion(), 600);
            } else {
                btn.classList.add('wrong');
                hp--;
                updateHpUI();

                const hpBox = document.getElementById('hp-display');
                hpBox.classList.add('shake');
                setTimeout(() => hpBox.classList.remove('shake'), 300);

                if (vibrateEnabled && navigator.vibrate) navigator.vibrate(200);

                if (hp <= 0) {
                    isAnsweringLocked = true;
                    setTimeout(() => showLoseModal("💔 反應爐過載！"), 500);
                } else {
                    setTimeout(() => btn.classList.remove('wrong'), 600);
                }
            }
        }

        function showLoseModal(reason) {
            clearInterval(timerInterval);
            const card = document.getElementById('msg-card');
            card.className = 'modal-card lose-theme';
            document.getElementById('msg-title').innerHTML = reason || "💔 反應爐過載！";
            document.getElementById('msg-title').style.color = "var(--accent-red)";
            document.getElementById('msg-body').innerText = `機甲受到重創，本次獲得分數：${score} 分`;
            document.getElementById('msg-modal').classList.remove('hidden');
        }

        function showWinModal() {
            clearInterval(timerInterval);
            const card = document.getElementById('msg-card');
            card.className = 'modal-card';
            document.getElementById('msg-title').innerHTML = "🎉 反應爐充能完成！";
            document.getElementById('msg-title').style.color = "var(--accent-cyan)";
            document.getElementById('msg-body').innerText = `恭喜完成 25 題乘法速算特訓！最終得分：${score} 分`;
            document.getElementById('msg-modal').classList.remove('hidden');
        }

        function speakCurrentQuestion() {
            if (!soundEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let text = `${currentQuestion.numA} 乘以 ${currentQuestion.numB}`;
            let utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-TW';
            utter.rate = 1.0;
            window.speechSynthesis.speak(utter);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerText = soundEnabled ? "🔊" : "🔇";
        }

        function toggleVibrate() {
            vibrateEnabled = !vibrateEnabled;
            document.getElementById('vibrate-btn').innerText = vibrateEnabled ? "📳" : "🔕";
        }

        function togglePause() {
            clearInterval(timerInterval);
            const card = document.getElementById('msg-card');
            card.className = 'modal-card';
            document.getElementById('msg-title').innerHTML = "⏸️ 遊戲暫停";
            document.getElementById('msg-title').style.color = "var(--accent-yellow)";
            document.getElementById('msg-body').innerText = `當前得分：${score} 分`;
            document.getElementById('msg-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
