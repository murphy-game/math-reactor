<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>機甲反應爐 - 乘法速算特訓 ⚡</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.9);
            --accent-cyan: #38bdf8;
            --accent-green: #4ade80;
            --accent-yellow: #facc15;
            --accent-red: #ff7675;
            --text-color: #f8fafc;
            --btn-bg: #334155;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

        body {
            font-family: "Chalkboard SE", "Comic Sans MS", "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh; overflow: hidden;
        }

        /* 雙層背景防呆：圖檔載入失敗自動退回科幻漸層 */
        .battle-bg-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            overflow: hidden; pointer-events: none;
        }
        .battle-bg-img {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.65;
        }

        .app-container {
            width: 100%; max-width: 420px; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px 15px; padding-bottom: max(12px, env(safe-area-inset-bottom)); position: relative;
        }

        .hud {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(30, 41, 59, 0.85); padding: 6px 12px; border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3); backdrop-filter: blur(5px);
        }
        .hud-btn-group { display: flex; gap: 6px; }
        .hud-icon-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 0.95rem;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
        }

        .score-box { text-align: right; }
        .score-box div { font-size: 0.65rem; color: #94a3b8; }
        .score-box span { font-size: 0.95rem; font-weight: bold; color: var(--accent-cyan); }

        .progress-text { text-align: center; font-size: 0.85rem; color: var(--accent-yellow); font-weight: bold; margin: 4px 0; }

        .main-game-area {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; width: 100%; min-height: 0; position: relative;
        }

        .battle-stage {
            display: flex; justify-content: space-around; align-items: center;
            width: 100%; max-width: 320px; height: 110px; position: relative; margin-bottom: 5px;
        }
        .hero-box, .monster-box {
            position: relative; width: 95px; height: 95px;
            display: flex; justify-content: center; align-items: center;
        }
        .hero-img, .monster-img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(56, 189, 248, 0.4));
        }
        .hero-img { animation: floatHero 2.5s ease-in-out infinite; }
        @keyframes floatHero { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .monster-img { animation: pulseMonster 1.8s ease-in-out infinite; }
        @keyframes pulseMonster { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .boom-effect {
            position: absolute; top: 50%; right: 10px; transform: translate(0, -50%) scale(0);
            width: 140px; height: 140px; pointer-events: none; opacity: 0; z-index: 10;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center;
        }
        .boom-effect.active { transform: translate(0, -50%) scale(1.2); opacity: 1; }

        .math-card {
            background: rgba(15, 23, 42, 0.9); border: 3px solid var(--accent-cyan);
            border-radius: 20px; padding: 16px 40px; text-align: center;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.25); margin-bottom: 8px; min-width: 220px;
        }
        .math-formula { font-size: 2.6rem; font-weight: bold; letter-spacing: 2px; color: #fff; line-height: 1.2; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: auto; }
        .opt-btn {
            background: var(--btn-bg); border: none; border-bottom: 5px solid #1e293b;
            border-radius: 16px; padding: 14px 0; font-size: 1.6rem; font-weight: bold;
            color: #fff; cursor: pointer; transition: all 0.08s ease;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .opt-btn:active { transform: translateY(3px); border-bottom-width: 2px; background: #475569; }
        .opt-btn.correct { background: var(--accent-green) !important; color: #0f172a !important; }
        .opt-btn.wrong { background: #ef4444 !important; color: #fff !important; }

        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(5px);
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        .modal-card {
            background: var(--card-bg); border: 3px solid var(--accent-cyan);
            border-radius: 20px; padding: 20px; width: 85%; max-width: 320px; text-align: center;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3); transition: border-color 0.3s;
        }

        .modal-card.lose-theme {
            border-color: var(--accent-red);
            box-shadow: 0 10px 30px rgba(255, 118, 117, 0.4);
            animation: pulseRed 1.5s infinite;
        }
        @keyframes pulseRed { 0%, 100% { border-color: var(--accent-red); } 50% { border-color: #d63031; } }

        .menu-btn {
            background: transparent; border: 2px solid var(--accent-cyan);
            color: white; padding: 12px 20px; margin: 8px 0; font-size: 1.1rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; width: 100%; transition: all 0.2s;
        }
        .menu-btn:active { transform: scale(0.95); background: var(--accent-cyan); color: #000; }
        .level-tag { font-size: 0.8rem; opacity: 0.8; display: block; margin-top: 2px; color: var(--accent-yellow); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 雙層背景容器 -->
    <div class="battle-bg-container">
        <img src="bg_reactor.png" class="battle-bg-img" onerror="this.style.display='none';">
    </div>

    <div class="app-container">
        <div class="hud">
            <div class="hud-btn-group">
                <button class="hud-icon-btn" id="sound-btn" onclick="toggleSound()">🔊</button>
                <button class="hud-icon-btn" id="vibrate-btn" onclick="toggleVibrate()">📳</button>
                <button class="hud-icon-btn" onclick="openLevelSelect()">⚙️</button>
                <button class="hud-icon-btn" onclick="togglePause()">⏸️</button>
            </div>
            <div class="score-box">
                <div>BEST: <span id="high-score">0</span></div>
                <div>SCORE: <span id="score">0</span></div>
            </div>
        </div>

        <div class="progress-text">反應爐進度：<span id="current-q-num">1</span> / 25</div>

        <div class="main-game-area">
            <div class="battle-stage">
                <div class="hero-box">
                    <img src="hero.png" class="hero-img" id="hero-img" onerror="this.style.display='none'; document.getElementById('emoji-hero').style.display='block';">
                    <span id="emoji-hero" style="font-size:3.5rem; display:none;">🤖</span>
                </div>
                <div style="font-size:1.5rem; font-weight:bold; color:var(--accent-yellow);">VS</div>
                <div class="monster-box">
                    <img src="m1.png" class="monster-img" id="monster-img" onerror="this.style.display='none'; document.getElementById('emoji-monster').style.display='block';">
                    <span id="emoji-monster" style="font-size:3.5rem; display:none;">👾</span>
                </div>

                <div id="boom-box" class="boom-effect">
                    <img src="boom.png" style="width:100%; height:100%; object-fit:contain;" onerror="this.style.display='none'; document.getElementById('emoji-boom').style.display='block';">
                    <span id="emoji-boom" style="font-size:4rem; display:none;">💥</span>
                </div>
            </div>

            <div class="math-card">
                <div class="math-formula"><span id="num-a">7</span> × <span id="num-b">8</span></div>
            </div>
        </div>

        <div class="options-grid" id="options-grid"></div>

        <div id="level-modal" class="modal">
            <div class="modal-card">
                <div style="height: 80px; display:flex; justify-content:center; align-items:center; margin-bottom:10px;">
                    <img src="hero.png" style="max-height:100%; object-fit:contain;" onerror="this.style.display='none'; document.getElementById('modal-emoji').style.display='block';">
                    <span id="modal-emoji" style="font-size:3.5rem; display:none;">⚛️</span>
                </div>
                <h2 style="color:var(--accent-cyan); margin: 5px 0;">乘法速算特訓</h2>
                <p style="color:#94a3b8; font-size:0.85rem; margin-bottom:12px;">請選擇訓練難度</p>
                <button class="menu-btn" onclick="selectDifficulty(1)">🟢 見習駕駛 <span class="level-tag">專攻 2, 3, 4, 5 的乘法</span></button>
                <button class="menu-btn" onclick="selectDifficulty(2)">🟡 正式隊員 <span class="level-tag">專攻 6, 7, 8, 9 的乘法</span></button>
                <button class="menu-btn" onclick="selectDifficulty(3)">🔴 王牌機師 <span class="level-tag">2~9 全範圍速算大亂鬥</span></button>
            </div>
        </div>

        <!-- 結算 Modal -->
        <div id="game-modal" class="modal hidden">
            <div class="modal-card" id="result-modal-card">
                <div style="height: 110px; display:flex; justify-content:center; align-items:center; margin-bottom:10px;">
                    <img src="win.png" id="modal-result-img" style="max-height:100%; object-fit:contain;" onerror="this.style.display='none'; document.getElementById('modal-icon-emoji').style.display='block';">
                    <span id="modal-icon-emoji" style="font-size:4.5rem; display:none;">🏆</span>
                </div>
                <h2 id="modal-title" style="color:var(--accent-cyan); margin: 5px 0;">反應爐充能完成</h2>
                <p id="modal-desc" style="color:#94a3b8; font-size:0.9rem; margin-bottom:15px;">本次得分：0</p>
                <button class="menu-btn" id="result-confirm-btn" style="background:var(--accent-cyan); color:#000;" onclick="openLevelSelect()">重新選擇難度 ⚡</button>
            </div>
        </div>

        <!-- 15 分鐘防成癮冷卻 Modal -->
        <div id="cooldown-modal" class="modal hidden">
            <div class="modal-card" style="border-color:#ff7675;">
                <div style="font-size:3.5rem; margin-bottom:10px;">🛑</div>
                <h2 style="color:#ff7675; margin: 5px 0;">機甲過熱冷卻中</h2>
                <p style="color:#ccc; font-size:0.85rem; line-height:1.5; margin-bottom:15px;">
                    駕駛員請注意！您已連續練習滿 15 分鐘。<br>系統已啟動保護機制，請起身活動身體、看看遠方！
                </p>
                <div style="font-size:2.5rem; font-weight:bold; color:var(--accent-yellow); margin-bottom:15px;" id="cooldown-timer">05:00</div>
                <button class="menu-btn" style="border-color:#555; color:#888; cursor:not-allowed;" disabled>維修冷卻中...</button>
            </div>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let soundEnabled = true, vibrateEnabled = true;

        const monsterImages = ['m1.png', 'm2.png', 'm3.png', 'm4.png', 'm5.png'];
        const monsterEmojis = ['🐲', '🕷️', '🫠', '🗿', '🪴'];
        let lastMonsterIndex = -1; // 記錄上一隻出現的怪獸，避免連續重複

        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function triggerVibrate(ms = 40) { if (vibrateEnabled && navigator.vibrate) navigator.vibrate(ms); }

        function playSound(type) {
            if (!soundEnabled) return; initAudio(); if (!audioCtx) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.08);
                gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now); osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            }
        }

        function toggleSound() { soundEnabled = !soundEnabled; document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇'; }
        function toggleVibrate() { vibrateEnabled = !vibrateEnabled; document.getElementById('vibrate-btn').innerText = vibrateEnabled ? '📳' : '📴'; if (vibrateEnabled) triggerVibrate(30); }

        // --- 15 分鐘防成癮冷卻機制 ---
        let playTimeSeconds = 0;
        let cooldownSecondsLeft = 300; // 5 分鐘
        let cooldownInterval = null;

        setInterval(() => {
            playTimeSeconds++;
            if (playTimeSeconds >= 900 && !cooldownInterval) { // 900秒 = 15 分鐘
                triggerCooldown();
            }
        }, 1000);

        function triggerCooldown() {
            document.getElementById('cooldown-modal').classList.remove('hidden');
            cooldownSecondsLeft = 300;
            updateCooldownUI();

            cooldownInterval = setInterval(() => {
                cooldownSecondsLeft--;
                updateCooldownUI();
                if (cooldownSecondsLeft <= 0) {
                    clearInterval(cooldownInterval);
                    cooldownInterval = null;
                    playTimeSeconds = 0;
                    document.getElementById('cooldown-modal').classList.add('hidden');
                }
            }, 1000);
        }

        function updateCooldownUI() {
            const m = Math.floor(cooldownSecondsLeft / 60).toString().padStart(2, '0');
            const s = (cooldownSecondsLeft % 60).toString().padStart(2, '0');
            document.getElementById('cooldown-timer').innerText = `${m}:${s}`;
        }

        let currentDifficulty = 1;
        let currentQuestion = 0, totalQuestions = 25, score = 0;
        let highScore = parseInt(localStorage.getItem('reactor_high_score')) || 0;
        let correctAnswer = 0, isAnsweringLocked = false;
        let questionPool = [];

        function selectDifficulty(diff) {
            currentDifficulty = diff;
            document.getElementById('level-modal').classList.add('hidden');
            startGame();
        }

        function openLevelSelect() {
            document.getElementById('game-modal').classList.add('hidden');
            document.getElementById('level-modal').classList.remove('hidden');
        }

        // Fisher-Yates 隨機洗牌演算法（零重複保證）
        function buildQuestionPool() {
            const raw = [];
            let startA = 2, endA = 5;

            if (currentDifficulty === 2) { startA = 6; endA = 9; }
            else if (currentDifficulty === 3) { startA = 2; endA = 9; }

            for (let a = startA; a <= endA; a++) {
                for (let b = 2; b <= 9; b++) {
                    raw.push({ a, b, ans: a * b });
                }
            }
            // 完全洗牌打亂
            for (let i = raw.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [raw[i], raw[j]] = [raw[j], raw[i]];
            }
            questionPool = raw;
        }

        function generateQuestion() {
            isAnsweringLocked = false;
            if (questionPool.length === 0) buildQuestionPool();

            const q = questionPool.pop();
            correctAnswer = q.ans;

            document.getElementById('num-a').innerText = q.a;
            document.getElementById('num-b').innerText = q.b;
            document.getElementById('current-q-num').innerText = currentQuestion + 1;

            // 避開連續重複登場怪獸邏輯
            let mIndex;
            do {
                mIndex = Math.floor(Math.random() * monsterImages.length);
            } while (mIndex === lastMonsterIndex && monsterImages.length > 1);
            lastMonsterIndex = mIndex;

            const mImg = document.getElementById('monster-img');
            const mEmoji = document.getElementById('emoji-monster');
            
            mImg.src = monsterImages[mIndex];
            mImg.style.display = 'block';
            mEmoji.innerText = monsterEmojis[mIndex];
            mEmoji.style.display = 'none';

            generateOptions();
        }

        function generateOptions() {
            const grid = document.getElementById('options-grid'); grid.innerHTML = '';
            let options = [correctAnswer];
            while (options.length < 4) {
                let offset = (Math.floor(Math.random() * 4) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let wrongOpt = correctAnswer + offset;
                if (wrongOpt > 0 && !options.includes(wrongOpt)) options.push(wrongOpt);
            }
            options.sort(() => Math.random() - 0.5);
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn'; btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function triggerBoomEffect() {
            const boom = document.getElementById('boom-box');
            boom.classList.add('active');
            setTimeout(() => boom.classList.remove('active'), 350);
        }

        function checkAnswer(selected, btn) {
            if (isAnsweringLocked) return;
            if (selected === correctAnswer) {
                isAnsweringLocked = true; btn.classList.add('correct');
                playSound('correct'); triggerVibrate(50);
                triggerBoomEffect();

                score += 10; document.getElementById('score').innerText = score;
                setTimeout(() => {
                    currentQuestion++;
                    if (currentQuestion >= totalQuestions) endGame();
                    else generateQuestion();
                }, 400);
            } else {
                btn.classList.add('wrong'); playSound('wrong'); triggerVibrate(100);
                setTimeout(() => btn.classList.remove('wrong'), 600);
            }
        }

        function togglePause() {
            const modalContainer = document.getElementById('result-modal-card');
            const resultImg = document.getElementById('modal-result-img');
            const fallbackEmoji = document.getElementById('modal-icon-emoji');
            
            modalContainer.classList.remove('lose-theme');
            resultImg.src = 'hero.png'; resultImg.style.display = 'block';
            fallbackEmoji.innerText = "⚛️"; fallbackEmoji.style.display = 'none';

            document.getElementById('modal-title').style.color = "var(--accent-cyan)";
            document.getElementById('modal-title').innerText = "速算特訓暫停中";
            document.getElementById('modal-desc').innerText = `當前進度：${currentQuestion + 1} / ${totalQuestions}`;
            document.getElementById('game-modal').classList.remove('hidden');
        }

        function endGame() {
            let isNewHigh = false;
            if (score > highScore) { highScore = score; localStorage.setItem('reactor_high_score', highScore); isNewHigh = true; }
            
            const modalContainer = document.getElementById('result-modal-card');
            const resultImg = document.getElementById('modal-result-img');
            const fallbackEmoji = document.getElementById('modal-icon-emoji');
            const confirmBtn = document.getElementById('result-confirm-btn');
            
            resultImg.style.display = 'block'; fallbackEmoji.style.display = 'none';

            if (isNewHigh || score >= 200) {
                modalContainer.classList.remove('lose-theme');
                resultImg.src = 'win.png'; fallbackEmoji.innerText = "🏆";
                document.getElementById('modal-title').style.color = "var(--accent-cyan)";
                document.getElementById('modal-title').innerText = isNewHigh ? "🎉 突破新紀錄！" : "⚡ 怪獸全數擊退！";
                confirmBtn.style.background = "var(--accent-cyan)";
                confirmBtn.innerText = "再次挑戰 ⚡";
            } else {
                modalContainer.classList.add('lose-theme');
                resultImg.src = 'lose.png'; fallbackEmoji.innerText = "💥";
                document.getElementById('modal-title').style.color = "var(--accent-red)";
                document.getElementById('modal-title').innerText = "💥 機甲反應爐過載！";
                confirmBtn.style.background = "var(--accent-red)";
                confirmBtn.innerText = "重新維修 🛠️";
                playSound('wrong'); triggerVibrate(150);
            }

            document.getElementById('modal-desc').innerText = `最終得分：${score} (最高紀錄: ${highScore})`;
            document.getElementById('game-modal').classList.remove('hidden');
            updateScoreUI();
        }

        function startGame() {
            initAudio(); currentQuestion = 0; score = 0;
            lastMonsterIndex = -1;
            buildQuestionPool();
            updateScoreUI();
            document.getElementById('game-modal').classList.add('hidden');
            generateQuestion();
        }

        function updateScoreUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('high-score').innerText = highScore;
        }

        updateScoreUI();
    </script>
</body>
</html>
